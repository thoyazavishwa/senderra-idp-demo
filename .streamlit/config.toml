# The theme is PINNED to light on purpose.
#
# Every chart colour in senderra_demo/charts.py was validated against the light
# chart surface (#fcfcfb) for colour-vision-deficiency separation and contrast.
# Letting the OS flip the app to dark would put those same hexes on a dark
# surface, where neither result holds. Supporting both means a second validated
# palette and a runtime theme probe; for a single-audience demo that is cost
# without benefit.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f9f9f7"
textColor = "#0b0b0b"
font = "sans serif"

[server]
# 6 MB is a typical 50-page scan; 50 MB leaves room for the largest real files
# without letting a mis-drop consume the container's memory. This is PER FILE —
# a whole batch is capped separately by UPLOAD_BATCH_MB, because the per-file
# limit says nothing about twenty files arriving together.
maxUploadSize = 50

[client]
# Tracebacks are NOT shown in the browser.
#
# Two reasons, in order. An Azure exception quotes the request URL, and under a
# SAS credential that URL is the credential — so a rendered traceback on a
# public app URL is a credential disclosure. Second, this is a client-facing
# demo: the honest failure messages the app raises itself are better than a
# stack trace, and every Azure path already funnels through one
# (`store.last_error`, rendered redacted in the sidebar).
#
# The full traceback still goes to the server log — Manage app → Logs on
# Streamlit Cloud, stderr locally — so nothing is lost for debugging.
showErrorDetails = "none"

[browser]
gatherUsageStats = false
